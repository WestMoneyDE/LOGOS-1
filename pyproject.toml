[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-pstate-adapters"
version = "0.1.0"
description = "Deterministic persistent-state intervention adapters for LOGOS-1 research"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
