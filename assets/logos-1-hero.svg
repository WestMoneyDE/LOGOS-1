  </g>
  <g transform="translate(555 267)"><rect class="box" width="260" height="100" rx="18"/><text class="t label" x="24" y="38">MEMORY</text><text class="sub" x="24" y="65">episodic · semantic · procedural</text><text class="tiny" x="24" y="85">persistent state · provenance</text></g>
  <g transform="translate(530 428)"><rect class="box" width="285" height="100" rx="18"/><text class="t label" x="24" y="38">WORLD MODELS</text><text class="sub" x="24" y="65">belief · simulation · uncertainty</text><text class="tiny" x="24" y="85">imagined != observed</text></g>
  <g transform="translate(1045 267)"><rect class="box" width="270" height="100" rx="18"/><text class="t label" x="24" y="38">EVALUATION</text><text class="sub" x="24" y="65">scoring · critique · calibration</text><text class="tiny" x="24" y="85">D(S) · O(S) · C(S)</text></g>
  <g transform="translate(1045 428)"><rect class="box2" width="270" height="100" rx="18"/><text class="t label" x="24" y="38">GOVERNANCE</text><text class="sub" x="24" y="65">policy · grants · reconciliation</text><text class="tiny" x="24" y="85">assurance state outside memory</text></g>
