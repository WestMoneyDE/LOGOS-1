        <g transform="translate(170,45)"><path d="M20 4l15 6v12c0 13-10 22-15 25-5-3-15-12-15-25V10z" fill="none" stroke="#2bcfff" stroke-width="2"/><text x="0" y="64" font-size="15" fill="#2bcfff" font-weight="700">CONTROLLABLE</text><text x="0" y="88" font-size="13" fill="#cfefff">Bounded actions &amp; constraints</text></g>
        <g transform="translate(325,45)"><ellipse cx="20" cy="20" rx="22" ry="12" fill="none" stroke="#39cfff" stroke-width="2"/><circle cx="20" cy="20" r="5" fill="#39cfff"/><text x="-6" y="64" font-size="15" fill="#39cfff" font-weight="700">TRANSPARENT</text><text x="-6" y="88" font-size="13" fill="#cfefff">Interpretable reasoning &amp; decisions</text></g>
      </g>
    </g>
  </g>
