    <g transform="translate(660,390)"><rect width="240" height="96" rx="18"/><text x="28" y="36" fill="#f7fbff" font-size="24" font-weight="700">WORLD MODELS</text><text x="28" y="64" fill="#cfefff" font-size="19">Understanding &amp;</text><text x="28" y="86" fill="#cfefff" font-size="19">simulation</text></g>
    <g transform="translate(1140,250)"><rect width="220" height="96" rx="18"/><text x="28" y="36" fill="#f7fbff" font-size="24" font-weight="700">EVALUATION</text><text x="28" y="64" fill="#cfefff" font-size="19">Scoring, critique &amp;</text><text x="28" y="86" fill="#cfefff" font-size="19">uncertainty</text></g>
    <g transform="translate(1140,390)"><rect width="220" height="96" rx="18"/><text x="28" y="36" fill="#f7fbff" font-size="24" font-weight="700">GOVERNANCE</text><text x="28" y="64" fill="#cfefff" font-size="19">Policies, rules &amp;</text><text x="28" y="86" fill="#cfefff" font-size="19">alignment</text></g>
    <g transform="translate(880,90)"><rect width="220" height="96" rx="18"/><text x="28" y="36" fill="#f7fbff" font-size="24" font-weight="700">REASONING</text><text x="28" y="64" fill="#cfefff" font-size="19">Structured inference &amp;</text><text x="28" y="86" fill="#cfefff" font-size="19">deliberation</text></g>
    <g transform="translate(1445,195)"><rect width="120" height="270" rx="20"/><text x="60" y="54" text-anchor="middle" fill="#f7fbff" font-size="20" font-weight="700">EXTERNAL</text><text x="60" y="82" text-anchor="middle" fill="#f7fbff" font-size="20" font-weight="700">EVIDENCE</text><text x="60" y="122" text-anchor="middle" fill="#cfefff" font-size="16">Data</text><text x="60" y="148" text-anchor="middle" fill="#cfefff" font-size="16">Sensors</text><text x="60" y="174" text-anchor="middle" fill="#cfefff" font-size="16">Documents</text></g>
  </g>
