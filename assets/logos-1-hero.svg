  <g transform="translate(75 666)"><rect width="430" height="114" rx="18" fill="#061426" stroke="#4bdfff" stroke-opacity=".25"/><text class="cyan" x="26" y="34" font-size="14" font-weight="800" letter-spacing="1.4">CORE INVARIANTS</text><text class="t" x="26" y="67" font-size="18" font-weight="700">Capability ≠ Authority</text><text class="t" x="26" y="94" font-size="18" font-weight="700">OUTCOME_UNKNOWN ≠ NOT_EXECUTED</text></g>
