    <path d="M870 298C915 298 915 320 950 330"/><path d="M900 438C930 438 930 430 950 425"/><path d="M1140 298C1080 298 1080 320 1010 330"/><path d="M1140 438C1080 438 1080 430 1010 425"/><path d="M990 186C990 220 990 250 990 265"/><path d="M1445 330C1385 330 1330 330 1360 330"/><path d="M1445 350C1350 350 1270 350 1170 350" opacity="0.55"/>
  </g>
