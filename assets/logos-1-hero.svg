<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc">
  <title id="title">LOGOS-1 — Governed Intelligence for Safe Autonomous Agents</title>
  <desc id="desc">Futuristic architecture map with Gamma as the governed action core connecting memory, world models, reasoning, evaluation, governance, external evidence and execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020711"/><stop offset=".5" stop-color="#071329"/><stop offset="1" stop-color="#020711"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25e4ff"/><stop offset=".55" stop-color="#54a9ff"/><stop offset="1" stop-color="#8d70ff"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#183d75"/><stop offset=".6" stop-color="#0a2046"/><stop offset="1" stop-color="#071126"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#55bfff" stroke-opacity=".055" stroke-width="1"/></pattern>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#f7fbff}.mut{fill:#a8c7e7}.cyan{fill:#64e8ff}.box{fill:#08182e;stroke:#42d9ff;stroke-opacity:.55;stroke-width:1.6}.box2{fill:#081529;stroke:#8d78ff;stroke-opacity:.55;stroke-width:1.6}.label{font-size:22px;font-weight:700;letter-spacing:.6px}.sub{font-size:15px;fill:#a9c9e7}.tiny{font-size:13px;fill:#8cb4d9}.flow{fill:none;stroke:url(#cyan);stroke-width:2.3;stroke-opacity:.82}.dash{fill:none;stroke:#51dfff;stroke-width:1.5;stroke-opacity:.32;stroke-dasharray:8 9}
    </style>
  </defs>
  <rect width="1774" height="887" fill="url(#bg)"/>
  <rect width="1774" height="887" fill="url(#grid)"/>
  <rect x="30" y="28" width="1714" height="831" rx="28" fill="none" stroke="#b6eaff" stroke-opacity=".12"/>
