    <text x="0" y="180" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#f7fbff">Governed Intelligence for Safe Autonomous Agents</text>
    <text x="0" y="235" font-size="18" letter-spacing="6" font-family="Arial, Helvetica, sans-serif" fill="#7fe7ff">MEMORY · REASONING · EVIDENCE · CONTROL</text>
    <g transform="translate(0,340)">
