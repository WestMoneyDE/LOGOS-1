    <text class="t" x="0" y="70" font-size="25" font-weight="600">Governed Intelligence for Safe Autonomous Agents</text>
    <text class="cyan" x="0" y="106" font-size="15" font-weight="700" letter-spacing="5">MEMORY · REASONING · EVIDENCE · CONTROL</text>
  </g>
  <g transform="translate(785 94)">
