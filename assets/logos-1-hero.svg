    <rect x="105" y="100" width="230" height="74" rx="18" fill="#081528" stroke="#28d7ff"/><text x="220" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#63ddff">SAFETY BOUNDARY</text><text x="220" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d8f6ff">Constraints · Guarantees · Fail-safes</text>
