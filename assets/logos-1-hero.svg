<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">LOGOS-1 — Governed Intelligence for Safe Autonomous Agents</title>
  <desc id="desc">A futuristic hero banner for the LOGOS-1 repository showing memory, reasoning, evidence and control around a governed intelligence core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#020816"/>
      <stop offset="55%" stop-color="#06152e"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#1de9ff"/>
      <stop offset="50%" stop-color="#43b3ff"/>
      <stop offset="100%" stop-color="#9a6bff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <g opacity="0.18">
