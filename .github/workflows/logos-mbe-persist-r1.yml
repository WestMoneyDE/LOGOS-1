name: LOGOS MBE Persist External Evidence R1

on:
  push:
    branches:
      - "agent/mbe-external-execution-r1"
    paths:
      - ".github/workflows/logos-mbe-persist-r1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/mbe-external-execution-r1

      - name: Download exact successful external artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/logos-mbe-artifact
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/WestMoneyDE/LOGOS-1/actions/artifacts/9382977546/zip" \
            -o /tmp/logos-mbe-artifact/actions-artifact.zip
          unzip -t /tmp/logos-mbe-artifact/actions-artifact.zip
          unzip -q /tmp/logos-mbe-artifact/actions-artifact.zip -d /tmp/logos-mbe-artifact/outer
          echo "4fc6e1897ca7205adde171719d5b5b2bb01489526bb817fc6f0e3e18814e08c8  /tmp/logos-mbe-artifact/outer/returns/mbe-return.zip" | sha256sum -c -
          unzip -t /tmp/logos-mbe-artifact/outer/returns/mbe-return.zip
          mkdir -p /tmp/logos-mbe-artifact/inner
          unzip -q /tmp/logos-mbe-artifact/outer/returns/mbe-return.zip -d /tmp/logos-mbe-artifact/inner

      - name: Revalidate return envelope hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/logos-mbe-artifact/inner/mbe-return')
          env=json.loads((root/'RETURN-ENVELOPE.json').read_text())
          assert env['status']=='COMPLETE_RETURN'
          assert env['required_missing']==[]
          for rec in env['files']:
              p=root/rec['path']
              assert p.stat().st_size==rec['bytes'], rec['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256'], rec['path']
          print('COMPLETE_RETURN and all envelope hashes verified')
          PY

      - name: Persist immutable raw evidence
        run: |
          set -euo pipefail
          DEST="09-SESSIONS/2026-08-19-MBE-EXTERNAL-EXECUTION-R1/RAW"
          mkdir -p "$DEST"
          cp /tmp/logos-mbe-artifact/outer/returns/mbe-return.zip "$DEST/mbe-return.zip"
          cp /tmp/logos-mbe-artifact/outer/returns/mbe-return.zip.sha256.final "$DEST/mbe-return.zip.sha256.final"
          cp /tmp/logos-mbe-artifact/outer/returns/validate-return.txt "$DEST/validate-return.txt"
          cp /tmp/logos-mbe-artifact/inner/mbe-return/RETURN-ENVELOPE.json "$DEST/RETURN-ENVELOPE.json"
          cp /tmp/logos-mbe-artifact/inner/mbe-return/files/* "$DEST/"
          sha256sum "$DEST"/* > "$DEST/SHA256SUMS.txt"

      - name: Commit raw evidence to branch
        run: |
          set -euo pipefail
          git config user.name "LOGOS Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 09-SESSIONS/2026-08-19-MBE-EXTERNAL-EXECUTION-R1/RAW
          if git diff --cached --quiet; then
            echo "No new evidence to commit"
            exit 0
          fi
          git commit -m "evidence(mbe): persist complete external return"
          git push origin HEAD:agent/mbe-external-execution-r1
