name: LOGOS ENF Persist External Evidence R1

on:
  push:
    branches:
      - "agent/enf-external-execution-r1"
    paths:
      - ".github/workflows/logos-enf-persist-r1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  persist-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/enf-external-execution-r1

      - name: Download exact successful external artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/logos-enf-artifact
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/WestMoneyDE/LOGOS-1/actions/artifacts/9383758149/zip" \
            -o /tmp/logos-enf-artifact/actions-artifact.zip
          echo "e328a82247b4f89982a88863d310ec380f6689070fe11efc01809e0c70f81fc3  /tmp/logos-enf-artifact/actions-artifact.zip" | sha256sum -c -
          unzip -t /tmp/logos-enf-artifact/actions-artifact.zip
          unzip -q /tmp/logos-enf-artifact/actions-artifact.zip -d /tmp/logos-enf-artifact/outer
          echo "ef5976e51488f581c2cfea31727584a4c4ad5873b6ac27cc779ff4149bfe501c  /tmp/logos-enf-artifact/outer/returns/enf-return.zip" | sha256sum -c -
          unzip -t /tmp/logos-enf-artifact/outer/returns/enf-return.zip
          mkdir -p /tmp/logos-enf-artifact/inner
          unzip -q /tmp/logos-enf-artifact/outer/returns/enf-return.zip -d /tmp/logos-enf-artifact/inner

      - name: Revalidate return envelope hashes and source pin
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/logos-enf-artifact/inner/enf-return')
          env=json.loads((root/'RETURN-ENVELOPE.json').read_text())
          assert env['status']=='COMPLETE_RETURN'
          assert env['required_missing']==[]
          assert env['track']=='enf'
          assert env['source_pins']['commit']=='6b5391d014f36fdfa0f9d22d92c77387e5274308'
          for rec in env['files']:
              p=root/rec['path']
              assert p.stat().st_size==rec['bytes'], rec['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==rec['sha256'], rec['path']
          prov=json.loads((root/'files/source-provenance.json').read_text())
          assert prov['commit']=='6b5391d014f36fdfa0f9d22d92c77387e5274308'
          assert prov['logos_adapter_sha256']=='5465f39417e16fce39bff63b64b572732e632d08f0b3ff0f72586542e0144854'
          print('COMPLETE_RETURN, source pin, adapter pin and all envelope hashes verified')
          PY

      - name: Persist immutable raw evidence
        run: |
          set -euo pipefail
          DEST="09-SESSIONS/2026-08-19-ENF-EXTERNAL-EXECUTION-R1/RAW"
          mkdir -p "$DEST"
          cp /tmp/logos-enf-artifact/outer/returns/enf-return.zip "$DEST/enf-return.zip"
          cp /tmp/logos-enf-artifact/outer/returns/enf-return.zip.sha256 "$DEST/enf-return.zip.sha256"
          cp /tmp/logos-enf-artifact/outer/returns/enf-return.zip.sha256.final "$DEST/enf-return.zip.sha256.final"
          cp /tmp/logos-enf-artifact/outer/returns/validate-return.txt "$DEST/validate-return.txt"
          cp /tmp/logos-enf-artifact/outer/returns/collect-return.txt "$DEST/collect-return.txt"
          cp /tmp/logos-enf-artifact/inner/enf-return/RETURN-ENVELOPE.json "$DEST/RETURN-ENVELOPE.json"
          cp /tmp/logos-enf-artifact/inner/enf-return/files/* "$DEST/"
          find "$DEST" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$DEST/SHA256SUMS.txt"

      - name: Commit raw evidence to branch
        run: |
          set -euo pipefail
          git config user.name "LOGOS Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add 09-SESSIONS/2026-08-19-ENF-EXTERNAL-EXECUTION-R1/RAW
          if git diff --cached --quiet; then
            echo "No new evidence to commit"
            exit 0
          fi
          git commit -m "evidence(enf): persist complete external return"
          git push origin HEAD:agent/enf-external-execution-r1
